name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: scripts/build.sh
      - run: scripts/test.sh
      - name: Make the dmg
        run: MARS_MACOS_VERSION="${GITHUB_REF_NAME#v}" scripts/package-macos.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/package/*.dmg \
            --title "Mars-Macos ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/macos/release-notes.md
