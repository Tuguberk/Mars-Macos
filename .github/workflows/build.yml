name: Build and test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: scripts/build.sh
      - run: scripts/test.sh
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mars-Macos-dmg
          path: build/package/*.dmg
